name: quality-gates

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      gate_force_fail:
        description: "Optional forced gate failure mode for regression evidence"
        required: false
        default: ""

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MPS_GATE_FORCE_FAIL: ${{ github.event.inputs.gate_force_fail || '' }}

permissions:
  contents: read

# One run per ref: a newer push cancels the older run, so an older, slower run can never deploy
# GitHub Pages over a newer one. Tag refs are unique, so release runs are never cancelled by this.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-typecheck-test-build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Verify manifest versions agree
        run: pnpm -w verify:versions

      - name: Run quality gates
        run: pnpm -w turbo run lint typecheck test build

      - name: Verify docs parity
        run: pnpm -w verify:docs-parity --strict

  release-build-artifacts:
    name: release-build-artifacts
    runs-on: ubuntu-24.04
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release changelog is built from git history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm -w build:release

      - name: Verify release artifacts
        run: pnpm -w verify:release-artifacts

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web-static
          path: |
            release/stable/v*/web/mps-web-v*-static.tar
          if-no-files-found: error
          retention-days: 14

  desktop-native-artifacts:
    name: desktop-native-${{ matrix.id }}
    needs:
      - quality
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            # The AppImage links against the build host's glibc; build on the oldest supported LTS.
            runs_on: ubuntu-22.04
            build_command: pnpm --filter @mps/desktop exec tauri build --config src-tauri/tauri.conf.json --bundles appimage
            artifact_name: desktop-linux-x64-native
            artifact_path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - id: windows-x64
            runs_on: windows-2025
            build_command: pnpm --filter @mps/desktop exec tauri build --config src-tauri/tauri.conf.json --no-bundle
            artifact_name: desktop-windows-x64-native
            artifact_path: apps/desktop/src-tauri/target/release/mps-desktop.exe
          - id: macos-arm64
            runs_on: macos-14
            build_command: pnpm --filter @mps/desktop exec tauri build --config src-tauri/tauri.conf.json --bundles app
            artifact_name: desktop-macos-arm64-native
            artifact_path: apps/desktop/src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: matrix.id == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Build native desktop artifact
        run: ${{ matrix.build_command }}

      - name: Upload native desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  github-pages-build:
    name: github-pages-build
    needs:
      - quality
      - web-e2e-smoke
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve GitHub Pages base path
        id: pages-metadata
        uses: actions/github-script@v8
        with:
          script: |
            let cname = ""
            let basePath = `/${context.repo.repo}/`

            try {
              const response = await github.request("GET /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo
              })

              cname = response.data?.cname?.trim() ?? ""
              if (cname.length > 0) {
                basePath = "/"
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            core.setOutput("base_path", basePath)
            core.setOutput("cname", cname)

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Build web app for GitHub Pages
        env:
          MPS_WEB_BASE_PATH: ${{ steps.pages-metadata.outputs.base_path }}
        run: pnpm --filter @mps/web build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy-github-pages:
    name: deploy-github-pages
    needs:
      - github-pages-build
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialise deployments and never abort one mid-flight; a queued older deployment is replaced by a
    # newer one, and the workflow-level concurrency already cancels superseded runs before they get here.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  web-e2e-smoke:
    name: web-e2e-smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @mps/web exec playwright install --with-deps chromium

      # e2e = full web Playwright suite; e2e:web / e2e:desktop = mandatory V1 threshold gates.
      - name: Run e2e suite and V1 gates
        run: pnpm -w turbo run e2e e2e:web e2e:desktop

      - name: Upload e2e and gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-and-gate-evidence
          path: .omo/evidence/**
          if-no-files-found: warn
          retention-days: 14

  github-release:
    name: github-release
    needs:
      - quality
      - web-e2e-smoke
      - release-build-artifacts
      - desktop-native-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches every manifest version
        run: node scripts/release/verify-versions.mjs --tag "${GITHUB_REF_NAME}"

      - name: Download native desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-native
          path: desktop-artifacts

      - name: Download web static archive
        uses: actions/download-artifact@v8
        with:
          name: release-web-static
          path: web-artifacts

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          # upload-artifact keeps paths below the last fixed directory (release/stable/).
          cp "web-artifacts/v${version}/web/mps-web-v${version}-static.tar" "release-assets/mps-web-v${version}-static.tar"
          cp desktop-artifacts/desktop-windows-x64-native/mps-desktop.exe release-assets/mps-desktop-windows-x64.exe
          cp desktop-artifacts/desktop-linux-x64-native/*.AppImage release-assets/mps-desktop-linux-x64.AppImage
          chmod +x release-assets/mps-desktop-linux-x64.AppImage
          # Artifact upload drops the executable bit, restore it before zipping the app bundle.
          chmod +x desktop-artifacts/desktop-macos-arm64-native/*.app/Contents/MacOS/*
          (cd desktop-artifacts/desktop-macos-arm64-native && zip -qry ../../release-assets/mps-desktop-macos-arm64.app.zip ./*.app)
          ls -la release-assets

      - name: Verify release assets and write SHA256SUMS
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/finalize-release-assets.mjs release-assets \
            mps-desktop-windows-x64.exe \
            mps-desktop-linux-x64.AppImage \
            mps-desktop-macos-arm64.app.zip \
            "mps-web-v${version}-static.tar"
          (cd release-assets && sha256sum -c SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
