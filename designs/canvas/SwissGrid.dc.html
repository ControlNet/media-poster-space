<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #f0ece4; text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: #a29a8c; }
    .prow[data-active="true"] { background: #f0ece4 !important; color: #0d0d0e !important; }
    .prow[data-active="true"] .prow-meta { color: #0d0d0e !important; font-weight: 600; }
    .cbx[data-checked="false"] { background: transparent !important; }
    .cbx[data-checked="false"] svg { display: none; }
    .go[data-disabled="true"] { background: transparent !important; border-color: rgba(240, 236, 228, 0.45) !important; border-style: dashed !important; color: rgba(240, 236, 228, 0.45) !important; }
  </style>
</helmet>
<div style="--accent: {{ accent }}; width: 1440px; height: 900px; display: grid; grid-template-columns: 380px minmax(0, 1fr); background: #0d0d0e; color: #f0ece4; overflow: hidden; box-sizing: border-box;">

  <div style="position: relative; overflow: hidden; background: var(--accent);">
    <div style="position: absolute; top: 3rem; left: 3rem; display: flex; align-items: center; gap: 1rem;">
      <span style="width: 34px; height: 34px; background: #0d0d0e; display: block;"></span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: #0d0d0e;">01 / 02</span>
    </div>

    <div style="position: absolute; right: -2.5rem; bottom: -3rem; width: 20rem; color: #0d0d0e; opacity: 0.16;">
      <svg viewBox="0 0 24 24" width="100%" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="{{ providerIconPath }}"></path></svg>
    </div>

    <div style="position: absolute; left: 3rem; bottom: 3rem; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 5rem; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase; color: #0d0d0e;">{{ providerLabel }}</div>
  </div>

  <div style="padding: 3.25rem 4rem; display: grid; align-content: start; gap: 1.75rem; box-sizing: border-box; overflow: hidden;">

    <div style="height: 6px; background: #f0ece4;"></div>

    <div style="display: flex; justify-content: space-between; gap: 2rem; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240, 236, 228, 0.55); margin-top: -0.9rem;">
      <span>Media Poster Space</span>
      <span>Connect · Step 01</span>
    </div>

    <h1 style="margin: 0; font-size: 3.4rem; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase; max-width: 13ch;">Connect a media server</h1>

    <div style="display: grid; margin: 0 -0.9rem; border-top: 2px solid #f0ece4;">
      <div class="prow" data-active="{{ jellyfinActive }}" style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 1.15rem; align-items: center; padding: 0.85rem 0.9rem; border-bottom: 1px solid rgba(240, 236, 228, 0.2); cursor: pointer;">
        <span style="width: 30px; height: 30px; background: #aa5cc3; display: grid; place-items: center; flex: none;"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="#0d0d0e" d="M12 .002C8.826.002-1.398 18.537.16 21.666c1.56 3.129 22.14 3.094 23.682 0C25.384 18.573 15.177 0 12 0zm7.76 18.949c-1.008 2.028-14.493 2.05-15.514 0C3.224 16.9 9.92 4.755 12.003 4.755c2.081 0 8.77 12.166 7.759 14.196zM12 9.198c-1.054 0-4.446 6.15-3.93 7.189.518 1.04 7.348 1.027 7.86 0 .511-1.027-2.874-7.19-3.93-7.19z"></path></svg></span>
        <span style="font-size: 1.02rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Jellyfin</span>
        <span class="prow-meta" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Ready</span>
      </div>
      <div class="prow" data-active="{{ embyActive }}" style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 1.15rem; align-items: center; padding: 0.85rem 0.9rem; border-bottom: 1px solid rgba(240, 236, 228, 0.2); cursor: pointer;">
        <span style="width: 30px; height: 30px; background: #52b54b; display: grid; place-items: center; flex: none;"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="#0d0d0e" d="M11.041 0c-.007 0-1.456 1.43-3.219 3.176L4.615 6.352l.512.513.512.512-2.819 2.791L0 12.961l1.83 1.848c1.006 1.016 2.438 2.46 3.182 3.209l1.351 1.359.508-.496c.28-.273.515-.498.524-.498.008 0 1.266 1.264 2.794 2.808L12.97 24l.187-.182c.23-.225 5.007-4.95 5.717-5.656l.52-.516-.502-.513c-.276-.282-.5-.52-.496-.53.003-.009 1.264-1.26 2.802-2.783 1.538-1.522 2.8-2.776 2.803-2.785.005-.012-3.617-3.684-6.107-6.193L17.65 4.6l-.505.505c-.279.278-.517.501-.53.497-.013-.005-1.27-1.267-2.793-2.805A449.655 449.655 0 0011.041 0zM9.223 7.367c.091.038 7.951 4.608 7.957 4.627.003.013-1.781 1.056-3.965 2.32a999.898 999.898 0 01-3.996 2.307c-.019.006-.026-1.266-.026-4.629 0-3.7.007-4.634.03-4.625Z"></path></svg></span>
        <span style="font-size: 1.02rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Emby</span>
        <span class="prow-meta" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Ready</span>
      </div>
      <div class="prow" data-active="{{ plexActive }}" style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 1.15rem; align-items: center; padding: 0.85rem 0.9rem; border-bottom: 2px solid #f0ece4; cursor: pointer;">
        <span style="width: 30px; height: 30px; background: #e5a00d; display: grid; place-items: center; flex: none;"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="#0d0d0e" d="M3.987 8.409c-.96 0-1.587.28-2.12.933v-.72H0v8.88s.038.018.127.037c.138.03.821.187 1.331-.249.441-.377.542-.814.542-1.318v-1.283c.533.573 1.147.813 2 .813 1.84 0 3.253-1.493 3.253-3.48 0-2.12-1.36-3.613-3.266-3.613Zm16.748 5.595.406.591c.391.614.894.906 1.492.908.621-.012 1.064-.562 1.226-.755 0 0-.307-.27-.686-.72-.517-.614-1.214-1.755-1.24-1.803l-1.198 1.779Zm-3.205-1.955c0-2.08-1.52-3.64-3.52-3.64s-3.467 1.587-3.467 3.573a3.48 3.48 0 0 0 3.507 3.52c1.413 0 2.626-.84 3.253-2.293h-2.04l-.093.093c-.427.4-.72.533-1.227.533-.787 0-1.373-.506-1.453-1.266h4.986c.04-.214.054-.307.054-.52Zm-7.671-.219c0 .769.11 1.701.868 2.722l.056.069c-.306.526-.742.88-1.248.88-.399 0-.814-.211-1.138-.579a2.177 2.177 0 0 1-.538-1.441V6.409H9.86l-.001 5.421Zm9.283 3.46h-2.39l2.247-3.332-2.247-3.335h2.39l2.248 3.335-2.248 3.332Zm1.593-1.286Zm-17.162-.342c-.933 0-1.68-.773-1.68-1.72s.76-1.666 1.68-1.666c.92 0 1.68.733 1.68 1.68 0 .946-.733 1.706-1.68 1.706Zm18.361-1.974L24 8.622h-2.391l-.87 1.293 1.195 1.773Zm-9.404-.466c.16-.706.72-1.133 1.493-1.133.773 0 1.373.467 1.507 1.133h-3Z"></path></svg></span>
        <span style="font-size: 1.02rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Plex</span>
        <span class="prow-meta" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Soon</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 2.5rem;">
      <label style="grid-column: 1 / -1; display: grid; gap: 0.45rem;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Server address</span>
        <div style="font-size: 1.1rem; padding-bottom: 0.45rem; border-bottom: 2px solid #f0ece4;">{{ serverValue }}</div>
      </label>
      <label style="display: grid; gap: 0.45rem;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Username</span>
        <div style="font-size: 1.1rem; padding-bottom: 0.45rem; border-bottom: 2px solid #f0ece4;">curator</div>
      </label>
      <label style="display: grid; gap: 0.45rem;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240, 236, 228, 0.5);">Password</span>
        <div style="font-size: 1.1rem; letter-spacing: 0.16em; padding-bottom: 0.45rem; border-bottom: 2px solid #f0ece4;">••••••••••</div>
      </label>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span style="width: 13px; height: 13px; background: var(--accent); display: block; flex: none;"></span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #f0ece4;">{{ statusText }}</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 0.6rem 2rem;">
      <label style="display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer;">
        <span class="cbx" data-checked="true" style="width: 15px; height: 15px; border: 2px solid #f0ece4; background: #f0ece4; display: grid; place-items: center; flex: none; box-sizing: border-box;">
          <svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.2 6.2 4.7 8.6 9.8 3.5" fill="none" stroke="#0d0d0e" stroke-width="2" stroke-linecap="square"></path></svg>
        </span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;">Remember connection</span>
      </label>
      <label style="display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer;">
        <span class="cbx" data-checked="true" style="width: 15px; height: 15px; border: 2px solid #f0ece4; background: #f0ece4; display: grid; place-items: center; flex: none; box-sizing: border-box;">
          <svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.2 6.2 4.7 8.6 9.8 3.5" fill="none" stroke="#0d0d0e" stroke-width="2" stroke-linecap="square"></path></svg>
        </span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;">Remember username</span>
      </label>
      <label style="display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer;">
        <span class="cbx" data-checked="false" style="width: 15px; height: 15px; border: 2px solid #f0ece4; background: transparent; display: grid; place-items: center; flex: none; box-sizing: border-box;">
          <svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.2 6.2 4.7 8.6 9.8 3.5" fill="none" stroke="#0d0d0e" stroke-width="2" stroke-linecap="square"></path></svg>
        </span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;">Remember password</span>
      </label>
    </div>

    <div class="go" data-disabled="{{ primaryDisabled }}" style="padding: 1.1rem 1.25rem; background: var(--accent); border: 2px solid var(--accent); color: #0d0d0e; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; cursor: pointer; box-sizing: border-box;">{{ authLabel }}</div>

    <div style="display: flex; justify-content: space-between; gap: 1rem; padding-top: 0.4rem; border-top: 1px solid rgba(240, 236, 228, 0.22); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase;">
      <span style="color: #f0ece4;">01 Platform · Server · Sign in</span>
      <span style="color: rgba(240, 236, 228, 0.4);">02 Libraries</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"provider":{"editor":"enum","options":["jellyfin","emby","plex"],"default":"jellyfin"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const jellyfinPath = "M12 .002C8.826.002-1.398 18.537.16 21.666c1.56 3.129 22.14 3.094 23.682 0C25.384 18.573 15.177 0 12 0zm7.76 18.949c-1.008 2.028-14.493 2.05-15.514 0C3.224 16.9 9.92 4.755 12.003 4.755c2.081 0 8.77 12.166 7.759 14.196zM12 9.198c-1.054 0-4.446 6.15-3.93 7.189.518 1.04 7.348 1.027 7.86 0 .511-1.027-2.874-7.19-3.93-7.19z";
    const embyPath = "M11.041 0c-.007 0-1.456 1.43-3.219 3.176L4.615 6.352l.512.513.512.512-2.819 2.791L0 12.961l1.83 1.848c1.006 1.016 2.438 2.46 3.182 3.209l1.351 1.359.508-.496c.28-.273.515-.498.524-.498.008 0 1.266 1.264 2.794 2.808L12.97 24l.187-.182c.23-.225 5.007-4.95 5.717-5.656l.52-.516-.502-.513c-.276-.282-.5-.52-.496-.53.003-.009 1.264-1.26 2.802-2.783 1.538-1.522 2.8-2.776 2.803-2.785.005-.012-3.617-3.684-6.107-6.193L17.65 4.6l-.505.505c-.279.278-.517.501-.53.497-.013-.005-1.27-1.267-2.793-2.805A449.655 449.655 0 0011.041 0zM9.223 7.367c.091.038 7.951 4.608 7.957 4.627.003.013-1.781 1.056-3.965 2.32a999.898 999.898 0 01-3.996 2.307c-.019.006-.026-1.266-.026-4.629 0-3.7.007-4.634.03-4.625Z";
    const plexPath = "M3.987 8.409c-.96 0-1.587.28-2.12.933v-.72H0v8.88s.038.018.127.037c.138.03.821.187 1.331-.249.441-.377.542-.814.542-1.318v-1.283c.533.573 1.147.813 2 .813 1.84 0 3.253-1.493 3.253-3.48 0-2.12-1.36-3.613-3.266-3.613Zm16.748 5.595.406.591c.391.614.894.906 1.492.908.621-.012 1.064-.562 1.226-.755 0 0-.307-.27-.686-.72-.517-.614-1.214-1.755-1.24-1.803l-1.198 1.779Zm-3.205-1.955c0-2.08-1.52-3.64-3.52-3.64s-3.467 1.587-3.467 3.573a3.48 3.48 0 0 0 3.507 3.52c1.413 0 2.626-.84 3.253-2.293h-2.04l-.093.093c-.427.4-.72.533-1.227.533-.787 0-1.373-.506-1.453-1.266h4.986c.04-.214.054-.307.054-.52Zm-7.671-.219c0 .769.11 1.701.868 2.722l.056.069c-.306.526-.742.88-1.248.88-.399 0-.814-.211-1.138-.579a2.177 2.177 0 0 1-.538-1.441V6.409H9.86l-.001 5.421Zm9.283 3.46h-2.39l2.247-3.332-2.247-3.335h2.39l2.248 3.335-2.248 3.332Zm1.593-1.286Zm-17.162-.342c-.933 0-1.68-.773-1.68-1.72s.76-1.666 1.68-1.666c.92 0 1.68.733 1.68 1.68 0 .946-.733 1.706-1.68 1.706Zm18.361-1.974L24 8.622h-2.391l-.87 1.293 1.195 1.773Zm-9.404-.466c.16-.706.72-1.133 1.493-1.133.773 0 1.373.467 1.507 1.133h-3Z";

    const providers = {
      jellyfin: { label: "Jellyfin", accent: "#aa5cc3", server: "https://jellyfin.home.lan", version: "10.9.11", latency: 38, supported: true, iconPath: jellyfinPath },
      emby: { label: "Emby", accent: "#52b54b", server: "https://emby.home.lan", version: "4.8.10.0", latency: 44, supported: true, iconPath: embyPath },
      plex: { label: "Plex", accent: "#e5a00d", server: "https://plex.home.lan", version: "1.40.2", latency: 61, supported: false, iconPath: plexPath }
    };

    const id = providers[this.props.provider] ? this.props.provider : "jellyfin";
    const p = providers[id];

    return {
      accent: p.accent,
      providerLabel: p.label,
      providerIconPath: p.iconPath,
      serverValue: p.server,
      statusText: p.supported
        ? "Reachable — " + p.label + " " + p.version + " / " + p.latency + "ms"
        : "Unsupported — " + p.label + " support is coming soon",
      authLabel: p.supported ? "Login" : p.label + " support coming soon",
      primaryDisabled: p.supported ? "false" : "true",
      jellyfinActive: id === "jellyfin" ? "true" : "false",
      embyActive: id === "emby" ? "true" : "false",
      plexActive: id === "plex" ? "true" : "false"
    };
  }
}
</script>
</body>
</html>
