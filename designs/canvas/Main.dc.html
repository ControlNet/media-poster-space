<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Chivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #f2f4f6; text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: rgba(242, 244, 246, 0.6); }

    /* the switch: panel width carries the motion, everything else follows it */
    .panel { transition: width 520ms cubic-bezier(0.22, 0.8, 0.2, 1), background-color 420ms ease; }
    .edge { transition: background-color 420ms ease, opacity 240ms ease; }
    .railview { transition: opacity 240ms ease, transform 240ms ease; }
    .panel[data-selected="true"] .railview { opacity: 0; transform: translateX(-8px); pointer-events: none; }
    /* Hover is paint-only. Widening a rail overflowed the row and shoved the
       selected panel sideways, which read as a glitch. */
    .panel[data-selected="false"]:hover { background-color: #0d1116 !important; }
    .panel[data-selected="false"]:hover .railwash { opacity: 0.16; transform: none; }
    .panel[data-selected="false"]:hover .edge { opacity: 1 !important; }
    .panel[data-selected="false"]:hover .railglyph { filter: none; transform: scale(1.06); }
    .railwash { position: absolute; inset: 0; opacity: 0; transform: translateY(14%); pointer-events: none; transition: opacity 300ms ease, transform 300ms ease; }
    .railglyph { transition: filter 240ms ease, transform 240ms ease; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .wideview > * { animation: rise 420ms cubic-bezier(0.22, 0.8, 0.2, 1) both; }
    .wideview > *:nth-child(1) { animation-delay: 90ms; }
    .wideview > *:nth-child(2) { animation-delay: 170ms; }
    .wideview > *:nth-child(3) { animation-delay: 250ms; }
    .watermark { animation: rise 620ms ease both; animation-delay: 120ms; }

    .accented { transition: background-color 420ms ease, border-color 420ms ease, color 420ms ease; }
    .status[data-tone="ok"] { border-left-color: #6dc8a4 !important; color: #6dc8a4 !important; }
    .status[data-tone="notice"] { border-left-color: var(--accent) !important; color: rgba(242, 244, 246, 0.78) !important; }
    .cbx[data-checked="false"] { background: transparent !important; border-color: rgba(242, 244, 246, 0.28) !important; }
    .cbx[data-checked="false"] svg { display: none; }
    .go[data-disabled="true"] { background: transparent !important; border: 1px solid rgba(242, 244, 246, 0.2) !important; color: rgba(242, 244, 246, 0.38) !important; cursor: not-allowed !important; }

    @media (prefers-reduced-motion: reduce) {
      .panel, .edge, .railview, .railwash, .railglyph, .accented { transition: none !important; }
      .wideview > *, .watermark { animation: none !important; }
    }
  </style>
</helmet>
<div style="--accent: {{ accent }}; width: 1440px; height: 900px; display: flex; background: #0b0d10; color: #f2f4f6; overflow: hidden; box-sizing: border-box;">
  <sc-for list="{{ panels }}" as="panel" hint-placeholder-count="3">
    <div class="panel" data-selected="{{ panel.selected }}" onClick="{{ panel.pick }}" style="position: relative; width: {{ panel.width }}; flex: none; height: 100%; overflow: hidden; cursor: pointer; background: {{ panel.background }}; border-left: 1px solid rgba(255, 255, 255, 0.07);">
      <div class="edge" style="position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: {{ panel.colour }}; opacity: {{ panel.edgeOpacity }}; z-index: 2;"></div>

      <div class="railwash" style="background: linear-gradient(to top, {{ panel.colour }} 0%, transparent 72%); z-index: 0;"></div>

      <div class="railview" style="position: absolute; top: 0; left: 0; bottom: 0; width: 120px; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); justify-items: center; padding: 2.25rem 0; box-sizing: border-box;">
        <span class="railglyph" style="display: grid; place-items: center; color: {{ panel.colour }}; filter: grayscale(0.12) brightness(0.92); opacity: 0.75; flex: none;"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="{{ panel.iconPath }}"></path></svg></span>
        <span style="align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 1rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(242, 244, 246, 0.4);">{{ panel.label }}</span>
      </div>

      <sc-if value="{{ panel.selected }}" hint-placeholder-val="{{ true }}">
        <div class="wideview" style="position: relative; width: 1200px; height: 100%; display: grid; align-content: center; gap: 1.5rem; padding: 3.5rem; box-sizing: border-box;">
          <div class="watermark" style="position: absolute; right: -6%; bottom: -22%; width: 52%; color: {{ panel.colour }}; opacity: 0.08; pointer-events: none;"><svg viewBox="0 0 24 24" width="100%" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="{{ panel.iconPath }}"></path></svg></div>

          <div style="display: grid; gap: 0.6rem; max-width: 38rem;">
            <div style="display: flex; align-items: center; gap: 1rem;"><span style="display: grid; place-items: center; color: {{ panel.colour }}; flex: none;"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="{{ panel.iconPath }}"></path></svg></span><h1 style="margin: 0; font-size: 2.9rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase; color: #f2f4f6;">{{ panel.label }}</h1></div>
                      </div>

          <sc-if value="{{ panel.showBanner }}" hint-placeholder-val="{{ false }}">
            <p class="accented" style="margin: 0; max-width: 34rem; padding: 0.65rem 0.8rem; background: #0f1216; border: 1px solid rgba(255, 255, 255, 0.07); border-left: 3px solid var(--accent); border-radius: 2px; font-size: 0.82rem; line-height: 1.5; color: rgba(242, 244, 246, 0.78);">{{ panel.bannerText }}</p>
          </sc-if>

          <div style="width: 34rem; display: grid; gap: 1.15rem; padding: 1.85rem; border-radius: 2px; border: 1px solid rgba(255, 255, 255, 0.08); background: #111418; box-sizing: border-box;">
            <div style="display: grid; gap: 0.45rem;"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(242, 244, 246, 0.45);">Server address</span><div class="accented" style="width: 100%; padding: 0.78rem 0.9rem; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 2px; background: #0b0d10; color: #f2f4f6; font-size: 0.95rem; box-sizing: border-box;border-bottom: 2px solid var(--accent);">{{ panel.server }}</div><p class="status accented" data-tone="{{ panel.statusTone }}" style="margin: 0; padding: 0.6rem 0.8rem; background: #0f1216; border: 1px solid rgba(255, 255, 255, 0.07); border-left: 3px solid rgba(242, 244, 246, 0.3); border-radius: 2px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 0.74rem; line-height: 1.5; margin-top: 0.15rem;">{{ panel.statusText }}</p></div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem;"><label style="display: grid; gap: 0.45rem;"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(242, 244, 246, 0.45);">Username</span><div style="width: 100%; padding: 0.78rem 0.9rem; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 2px; background: #0b0d10; color: #f2f4f6; font-size: 0.95rem; box-sizing: border-box;">curator</div></label><label style="display: grid; gap: 0.45rem;"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(242, 244, 246, 0.45);">Password</span><div style="width: 100%; padding: 0.78rem 0.9rem; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 2px; background: #0b0d10; color: #f2f4f6; font-size: 0.95rem; box-sizing: border-box;letter-spacing: 0.16em;">••••••••••</div></label></div>
            <div style="display: flex; flex-wrap: wrap; gap: 0.55rem 1.25rem;"><label style="display: inline-flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; color: rgba(242, 244, 246, 0.6); cursor: pointer;"><span class="cbx" data-checked="true" style="width: 15px; height: 15px; border-radius: 2px; border: 1px solid var(--accent); background: var(--accent); display: grid; place-items: center; flex: none; box-sizing: border-box; transition: background-color 380ms ease, border-color 380ms ease;"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.4 6.2 4.8 8.6 9.6 3.6" fill="none" stroke="#0b0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Remember connection</span></label><label style="display: inline-flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; color: rgba(242, 244, 246, 0.6); cursor: pointer;"><span class="cbx" data-checked="true" style="width: 15px; height: 15px; border-radius: 2px; border: 1px solid var(--accent); background: var(--accent); display: grid; place-items: center; flex: none; box-sizing: border-box; transition: background-color 380ms ease, border-color 380ms ease;"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.4 6.2 4.8 8.6 9.6 3.6" fill="none" stroke="#0b0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Remember username</span></label><label style="display: inline-flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; color: rgba(242, 244, 246, 0.6); cursor: pointer;"><span class="cbx" data-checked="false" style="width: 15px; height: 15px; border-radius: 2px; border: 1px solid var(--accent); background: var(--accent); display: grid; place-items: center; flex: none; box-sizing: border-box; transition: background-color 380ms ease, border-color 380ms ease;"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.4 6.2 4.8 8.6 9.6 3.6" fill="none" stroke="#0b0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Remember password</span></label></div>
            <div class="go accented" data-disabled="{{ panel.primaryDisabled }}" style="padding: 0.95rem 1rem; border: 1px solid var(--accent); border-radius: 2px; background: var(--accent); color: #0b0d10; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; cursor: pointer; box-sizing: border-box;">{{ panel.authLabel }}</div>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: "emby" };
  }

  renderVals() {
    const jellyfinPath = "M12 .002C8.826.002-1.398 18.537.16 21.666c1.56 3.129 22.14 3.094 23.682 0C25.384 18.573 15.177 0 12 0zm7.76 18.949c-1.008 2.028-14.493 2.05-15.514 0C3.224 16.9 9.92 4.755 12.003 4.755c2.081 0 8.77 12.166 7.759 14.196zM12 9.198c-1.054 0-4.446 6.15-3.93 7.189.518 1.04 7.348 1.027 7.86 0 .511-1.027-2.874-7.19-3.93-7.19z";
    const embyPath = "M11.041 0c-.007 0-1.456 1.43-3.219 3.176L4.615 6.352l.512.513.512.512-2.819 2.791L0 12.961l1.83 1.848c1.006 1.016 2.438 2.46 3.182 3.209l1.351 1.359.508-.496c.28-.273.515-.498.524-.498.008 0 1.266 1.264 2.794 2.808L12.97 24l.187-.182c.23-.225 5.007-4.95 5.717-5.656l.52-.516-.502-.513c-.276-.282-.5-.52-.496-.53.003-.009 1.264-1.26 2.802-2.783 1.538-1.522 2.8-2.776 2.803-2.785.005-.012-3.617-3.684-6.107-6.193L17.65 4.6l-.505.505c-.279.278-.517.501-.53.497-.013-.005-1.27-1.267-2.793-2.805A449.655 449.655 0 0011.041 0zM9.223 7.367c.091.038 7.951 4.608 7.957 4.627.003.013-1.781 1.056-3.965 2.32a999.898 999.898 0 01-3.996 2.307c-.019.006-.026-1.266-.026-4.629 0-3.7.007-4.634.03-4.625Z";
    const plexPath = "M3.987 8.409c-.96 0-1.587.28-2.12.933v-.72H0v8.88s.038.018.127.037c.138.03.821.187 1.331-.249.441-.377.542-.814.542-1.318v-1.283c.533.573 1.147.813 2 .813 1.84 0 3.253-1.493 3.253-3.48 0-2.12-1.36-3.613-3.266-3.613Zm16.748 5.595.406.591c.391.614.894.906 1.492.908.621-.012 1.064-.562 1.226-.755 0 0-.307-.27-.686-.72-.517-.614-1.214-1.755-1.24-1.803l-1.198 1.779Zm-3.205-1.955c0-2.08-1.52-3.64-3.52-3.64s-3.467 1.587-3.467 3.573a3.48 3.48 0 0 0 3.507 3.52c1.413 0 2.626-.84 3.253-2.293h-2.04l-.093.093c-.427.4-.72.533-1.227.533-.787 0-1.373-.506-1.453-1.266h4.986c.04-.214.054-.307.054-.52Zm-7.671-.219c0 .769.11 1.701.868 2.722l.056.069c-.306.526-.742.88-1.248.88-.399 0-.814-.211-1.138-.579a2.177 2.177 0 0 1-.538-1.441V6.409H9.86l-.001 5.421Zm9.283 3.46h-2.39l2.247-3.332-2.247-3.335h2.39l2.248 3.335-2.248 3.332Zm1.593-1.286Zm-17.162-.342c-.933 0-1.68-.773-1.68-1.72s.76-1.666 1.68-1.666c.92 0 1.68.733 1.68 1.68 0 .946-.733 1.706-1.68 1.706Zm18.361-1.974L24 8.622h-2.391l-.87 1.293 1.195 1.773Zm-9.404-.466c.16-.706.72-1.133 1.493-1.133.773 0 1.373.467 1.507 1.133h-3Z";

    const providers = {
      jellyfin: { key: "jellyfin", label: "Jellyfin", accent: "#aa5cc3", server: "https://jellyfin.home.lan", host: "jellyfin.home.lan:8096", version: "10.9.11", latency: 38, supported: true, iconPath: jellyfinPath },
      emby: { key: "emby", label: "Emby", accent: "#52b54b", server: "https://emby.home.lan", host: "emby.home.lan:8096", version: "4.8.10.0", latency: 44, supported: true, iconPath: embyPath },
      plex: { key: "plex", label: "Plex", accent: "#e5a00d", server: "https://plex.home.lan", host: "plex.home.lan:32400", version: "1.40.2", latency: 61, supported: false, iconPath: plexPath }
    };

    const order = ["jellyfin", "emby", "plex"];
    const id = providers[this.state.selected] ? this.state.selected : "emby";

    const panels = order.map((key) => {
      const q = providers[key];
      const selected = key === id;

      return {
        key,
        selected,
        label: q.label,
        colour: q.accent,
        iconPath: q.iconPath,
        server: q.server,
        width: selected ? "calc(100% - 240px)" : "120px",
        background: selected ? "#0e1116" : "#08090c",
        edgeOpacity: selected ? 1 : 0.3,
        statusTone: q.supported ? "ok" : "notice",
        statusText: q.supported
          ? "Server reachable \u00b7 " + q.label + " " + q.version + " \u00b7 " + q.latency + "ms"
          : q.label + " support is coming soon",
        showBanner: !q.supported,
        bannerText: q.label + " support is coming soon",
        authLabel: q.supported ? "Login" : q.label + " support coming soon",
        primaryDisabled: q.supported ? "false" : "true",
        pick: () => this.setState({ selected: key })
      };
    });

    return { accent: providers[id].accent, panels };
  }
}
</script>
</body>
</html>
