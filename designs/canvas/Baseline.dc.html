<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7ad9ff; text-decoration: none; }
    a:hover { color: #a8e7ff; }
    .mps-title { background: linear-gradient(to bottom, #fff, #b9b3a6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .mps-glass { -webkit-backdrop-filter: blur(32px) saturate(1.25); }
    .tile[data-active="true"] { border-color: var(--accent) !important; background: linear-gradient(160deg, var(--halo) 0%, rgba(255, 255, 255, 0.04) 100%) !important; box-shadow: 0 0 24px var(--glow) !important; color: #ffffff !important; }
    .tile[data-active="true"] .tile-icon { filter: none !important; transform: scale(1.08) !important; }
    .tile[data-active="true"] .tile-label { color: #ffffff !important; }
    .status[data-tone="idle"] { border-color: rgba(255, 255, 255, 0.08) !important; background: rgba(255, 255, 255, 0.03) !important; color: rgba(255, 255, 255, 0.68) !important; }
    .status[data-tone="checking"] { border-color: var(--accent) !important; background: linear-gradient(140deg, var(--halo) 0%, rgba(12, 18, 30, 0.72) 100%) !important; color: #f7f2ff !important; }
    .status[data-tone="ok"] { border-color: rgba(82, 181, 75, 0.28) !important; background: linear-gradient(140deg, rgba(82, 181, 75, 0.14) 0%, rgba(16, 30, 20, 0.72) 100%) !important; color: #aeeab1 !important; }
    .status[data-tone="error"] { border-color: rgba(255, 130, 130, 0.34) !important; background: linear-gradient(140deg, rgba(120, 28, 28, 0.22) 0%, rgba(34, 16, 16, 0.76) 100%) !important; color: #ffd8d8 !important; }
    .status[data-tone="notice"] { border-color: color-mix(in srgb, var(--accent) 45%, rgba(255, 255, 255, 0.12)) !important; background: linear-gradient(140deg, var(--halo) 0%, rgba(16, 22, 34, 0.74) 100%) !important; color: rgba(255, 255, 255, 0.82) !important; }
    .primary[data-disabled="true"] { opacity: 0.55 !important; cursor: not-allowed !important; }
  </style>
</helmet>
<div style="--accent: {{ accent }}; --glow: {{ glow }}; --halo: {{ halo }}; min-height: 1000px; display: grid; place-items: center; padding: clamp(1.5rem, 5vw, 3rem); background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 8%, #171c2b) 0%, #080c14 72%); color: #f4efe4; box-sizing: border-box;">
  <section class="mps-glass" style="width: min(42rem, 100%); display: grid; gap: 1.5rem; padding: clamp(2rem, 5vw, 3rem); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.875rem; background: linear-gradient(154deg, rgba(20, 28, 48, 0.45) 0%, rgba(10, 15, 25, 0.65) 100%); box-shadow: 0 24px 68px -18px rgba(0, 0, 0, 0.92), inset 0 0 0 1px rgba(122, 217, 255, 0.03), 0 0 0 1px var(--halo), 0 0 40px var(--glow); backdrop-filter: blur(32px) saturate(1.25); box-sizing: border-box;">

    <header style="display: grid; gap: 0.65rem;">
      <h1 class="mps-title" style="margin: 0; font-family: 'Avenir Next Condensed', 'Segoe UI', system-ui, sans-serif; font-size: clamp(2rem, 5vw, 2.6rem); letter-spacing: -0.03em;">Connect Media Server</h1>
      <p style="margin: 0; color: rgba(255, 255, 255, 0.55); line-height: 1.6; font-size: 1rem;">Choose your media platform, connect the server, then continue through authentication and library selection.</p>
    </header>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem;">
      <div class="tile" data-active="{{ jellyfinActive }}" style="position: relative; cursor: pointer; padding: 1.15rem 0.95rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; color: rgba(255, 255, 255, 0.78); min-height: 7.25rem; box-sizing: border-box;">
        <div class="tile-icon" style="width: 2rem; height: 2rem; display: grid; place-items: center; color: #aa5cc3; filter: grayscale(0.12) brightness(0.92);">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 .002C8.826.002-1.398 18.537.16 21.666c1.56 3.129 22.14 3.094 23.682 0C25.384 18.573 15.177 0 12 0zm7.76 18.949c-1.008 2.028-14.493 2.05-15.514 0C3.224 16.9 9.92 4.755 12.003 4.755c2.081 0 8.77 12.166 7.759 14.196zM12 9.198c-1.054 0-4.446 6.15-3.93 7.189.518 1.04 7.348 1.027 7.86 0 .511-1.027-2.874-7.19-3.93-7.19z"></path></svg>
        </div>
        <span class="tile-label" style="font-size: 0.84rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.54);">Jellyfin</span>
      </div>
      <div class="tile" data-active="{{ embyActive }}" style="position: relative; cursor: pointer; padding: 1.15rem 0.95rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; color: rgba(255, 255, 255, 0.78); min-height: 7.25rem; box-sizing: border-box;">
        <div class="tile-icon" style="width: 2rem; height: 2rem; display: grid; place-items: center; color: #52b54b; filter: grayscale(0.12) brightness(0.92);">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M11.041 0c-.007 0-1.456 1.43-3.219 3.176L4.615 6.352l.512.513.512.512-2.819 2.791L0 12.961l1.83 1.848c1.006 1.016 2.438 2.46 3.182 3.209l1.351 1.359.508-.496c.28-.273.515-.498.524-.498.008 0 1.266 1.264 2.794 2.808L12.97 24l.187-.182c.23-.225 5.007-4.95 5.717-5.656l.52-.516-.502-.513c-.276-.282-.5-.52-.496-.53.003-.009 1.264-1.26 2.802-2.783 1.538-1.522 2.8-2.776 2.803-2.785.005-.012-3.617-3.684-6.107-6.193L17.65 4.6l-.505.505c-.279.278-.517.501-.53.497-.013-.005-1.27-1.267-2.793-2.805A449.655 449.655 0 0011.041 0zM9.223 7.367c.091.038 7.951 4.608 7.957 4.627.003.013-1.781 1.056-3.965 2.32a999.898 999.898 0 01-3.996 2.307c-.019.006-.026-1.266-.026-4.629 0-3.7.007-4.634.03-4.625Z"></path></svg>
        </div>
        <span class="tile-label" style="font-size: 0.84rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.54);">Emby</span>
      </div>
      <div class="tile" data-active="{{ plexActive }}" style="position: relative; cursor: pointer; padding: 1.15rem 0.95rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; color: rgba(255, 255, 255, 0.78); min-height: 7.25rem; box-sizing: border-box;">
        <div class="tile-icon" style="width: 2rem; height: 2rem; display: grid; place-items: center; color: #e5a00d; filter: grayscale(0.12) brightness(0.92);">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M3.987 8.409c-.96 0-1.587.28-2.12.933v-.72H0v8.88s.038.018.127.037c.138.03.821.187 1.331-.249.441-.377.542-.814.542-1.318v-1.283c.533.573 1.147.813 2 .813 1.84 0 3.253-1.493 3.253-3.48 0-2.12-1.36-3.613-3.266-3.613Zm16.748 5.595.406.591c.391.614.894.906 1.492.908.621-.012 1.064-.562 1.226-.755 0 0-.307-.27-.686-.72-.517-.614-1.214-1.755-1.24-1.803l-1.198 1.779Zm-3.205-1.955c0-2.08-1.52-3.64-3.52-3.64s-3.467 1.587-3.467 3.573a3.48 3.48 0 0 0 3.507 3.52c1.413 0 2.626-.84 3.253-2.293h-2.04l-.093.093c-.427.4-.72.533-1.227.533-.787 0-1.373-.506-1.453-1.266h4.986c.04-.214.054-.307.054-.52Zm-7.671-.219c0 .769.11 1.701.868 2.722l.056.069c-.306.526-.742.88-1.248.88-.399 0-.814-.211-1.138-.579a2.177 2.177 0 0 1-.538-1.441V6.409H9.86l-.001 5.421Zm9.283 3.46h-2.39l2.247-3.332-2.247-3.335h2.39l2.248 3.335-2.248 3.332Zm1.593-1.286Zm-17.162-.342c-.933 0-1.68-.773-1.68-1.72s.76-1.666 1.68-1.666c.92 0 1.68.733 1.68 1.68 0 .946-.733 1.706-1.68 1.706Zm18.361-1.974L24 8.622h-2.391l-.87 1.293 1.195 1.773Zm-9.404-.466c.16-.706.72-1.133 1.493-1.133.773 0 1.373.467 1.507 1.133h-3Z"></path></svg>
        </div>
        <span class="tile-label" style="font-size: 0.84rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.54);">Plex</span>
      </div>
    </div>

    <sc-if value="{{ showSupportBanner }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 0.72rem 0.9rem; border-radius: 0.8rem; border: 1px solid color-mix(in srgb, var(--accent) 50%, rgba(255, 255, 255, 0.08)); background: linear-gradient(145deg, var(--halo) 0%, rgba(18, 24, 34, 0.7) 100%); color: rgba(255, 255, 255, 0.86); font-size: 0.84rem; line-height: 1.45;">{{ supportBannerText }}</p>
    </sc-if>

    <section style="display: grid; gap: 1.25rem;">
      <div style="display: grid; gap: 0.6rem;">
        <label style="font-size: 0.85rem; font-weight: 500; color: #d8deea; letter-spacing: 0.03em; text-transform: uppercase;">Server address</label>
        <div style="width: 100%; padding: 0.9rem 1rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.8rem; background: rgba(0, 0, 0, 0.4); color: #ffffff; font-size: 0.95rem; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);">{{ serverValue }}</div>
        <p class="status" data-tone="{{ statusTone }}" style="margin: 0; padding: 0.72rem 0.9rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.7rem; font-size: 0.82rem; line-height: 1.45; letter-spacing: 0.01em; backdrop-filter: blur(8px);">{{ statusText }}</p>
        <label style="display: inline-flex; gap: 0.55rem; align-items: center; font-size: 0.85rem; color: rgba(255, 255, 255, 0.62); cursor: pointer;">
          <span style="width: 14px; height: 14px; border-radius: 3px; background: var(--accent); display: grid; place-items: center; flex: none;">
            <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 6.2 4.8 8.5 9.5 3.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span>Remember connection</span>
        </label>
      </div>

      <div style="display: grid; gap: 1rem;">
        <label style="display: grid; gap: 0.6rem; font-size: 0.85rem; font-weight: 500; color: #d8deea; letter-spacing: 0.03em; text-transform: uppercase;">Username
          <div style="width: 100%; padding: 0.9rem 1rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.8rem; background: rgba(0, 0, 0, 0.4); color: #ffffff; font-size: 0.95rem; text-transform: none; letter-spacing: normal; font-weight: 400; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);">curator</div>
        </label>
        <label style="display: grid; gap: 0.6rem; font-size: 0.85rem; font-weight: 500; color: #d8deea; letter-spacing: 0.03em; text-transform: uppercase;">Password
          <div style="width: 100%; padding: 0.9rem 1rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.8rem; background: rgba(0, 0, 0, 0.4); color: #ffffff; font-size: 0.95rem; letter-spacing: 0.18em; text-transform: none; font-weight: 400; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);">••••••••••</div>
        </label>

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem 1rem; margin-top: 0.25rem;">
          <label style="display: inline-flex; gap: 0.55rem; align-items: center; font-size: 0.85rem; color: rgba(255, 255, 255, 0.62); cursor: pointer;">
            <span style="width: 14px; height: 14px; border-radius: 3px; background: var(--accent); display: grid; place-items: center; flex: none;">
              <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 6.2 4.8 8.5 9.5 3.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </span>
            <span>Remember username</span>
          </label>
          <label style="display: inline-flex; gap: 0.55rem; align-items: center; font-size: 0.85rem; color: rgba(255, 255, 255, 0.62); cursor: pointer;">
            <span style="width: 14px; height: 14px; border-radius: 3px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.35); display: grid; place-items: center; flex: none; box-sizing: border-box;"></span>
            <span>Remember password (stored encrypted on this device)</span>
          </label>
        </div>

        <div class="primary" data-disabled="{{ primaryDisabled }}" style="margin-top: 0.6rem; padding: 1rem; border-radius: 0.78rem; font-weight: 600; font-size: 1rem; letter-spacing: 0.02em; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 60%, black) 100%); color: #ffffff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2); cursor: pointer;">{{ authLabel }}</div>
      </div>
    </section>
  </section>
</div>
</x-dc>
<script data-dc-script data-props='{"provider":{"editor":"enum","options":["jellyfin","emby","plex"],"default":"jellyfin"},"$preview":{"width":1080,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const providers = {
      jellyfin: {
        label: "Jellyfin",
        accent: "#aa5cc3",
        glow: "rgba(170, 92, 195, 0.35)",
        halo: "rgba(170, 92, 195, 0.16)",
        server: "https://jellyfin.home.lan",
        version: "10.9.11",
        latency: 38,
        supported: true
      },
      emby: {
        label: "Emby",
        accent: "#52b54b",
        glow: "rgba(82, 181, 75, 0.32)",
        halo: "rgba(82, 181, 75, 0.14)",
        server: "https://emby.home.lan",
        version: "4.8.10.0",
        latency: 44,
        supported: true
      },
      plex: {
        label: "Plex",
        accent: "#e5a00d",
        glow: "rgba(229, 160, 13, 0.32)",
        halo: "rgba(229, 160, 13, 0.14)",
        server: "https://plex.home.lan",
        version: "1.40.2",
        latency: 61,
        supported: false
      }
    };

    const id = providers[this.props.provider] ? this.props.provider : "jellyfin";
    const p = providers[id];

    return {
      accent: p.accent,
      glow: p.glow,
      halo: p.halo,
      serverValue: p.server,
      authLabel: p.supported ? "Authenticate " + p.label : p.label + " support coming soon",
      statusTone: p.supported ? "ok" : "notice",
      statusText: p.supported
        ? "Server reachable · " + p.label + " " + p.version + " · " + p.latency + "ms"
        : p.label + " support is coming soon",
      showSupportBanner: !p.supported,
      supportBannerText: p.label + " support is coming soon",
      primaryDisabled: p.supported ? "false" : "true",
      jellyfinActive: id === "jellyfin" ? "true" : "false",
      embyActive: id === "emby" ? "true" : "false",
      plexActive: id === "plex" ? "true" : "false"
    };
  }
}
</script>
</body>
</html>
